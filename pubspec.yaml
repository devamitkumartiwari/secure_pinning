name: secure_pinning
description: >
  Certificate pinning for Flutter with SPKI pinning by default, a
  pure-Dart validation engine, and typed exceptions across every
  platform.
version: 0.0.1
homepage: https://github.com/devamitkumartiwari/secure_pinning
repository: https://github.com/devamitkumartiwari/secure_pinning
issue_tracker: https://github.com/devamitkumartiwari/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning
  - tls
  - http

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  secure_pinning_platform_interface: ^0.0.1

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

# test/fixtures/key.pem is the private key of a throwaway, locally
# self-signed test certificate (see the openssl commands documented in
# test/secure_pinning_engine_test.dart) — not a real secret, but pub.dev's
# publish validator flags any PEM private key pattern regardless.
false_secrets:
  - /test/fixtures/key.pem

# Links secure_pinning_platform_interface to the in-repo source instead of
# pub.dev so local development doesn't require publishing it first. Remove
# this block before `dart pub publish` — it's a local-dev-only override and
# pub will warn that it's ignored when published.
dependency_overrides:
  secure_pinning_platform_interface:
    path: packages/secure_pinning_platform_interface
