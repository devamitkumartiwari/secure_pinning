name: secure_pinning_apple
description: >
  iOS and macOS native probe-engine implementation for secure_pinning, in
  one shared package built on Security.framework.
version: 0.0.2
homepage: https://github.com/devamitkumartiwari/secure_pinning
repository: https://github.com/devamitkumartiwari/secure_pinning
issue_tracker: https://github.com/devamitkumartiwari/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

flutter:
  plugin:
    implements: secure_pinning
    platforms:
      ios:
        pluginClass: SecurePinningPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SecurePinningPlugin
        sharedDarwinSource: true

dependencies:
  flutter:
    sdk: flutter
  secure_pinning_platform_interface: ^0.0.2

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  secure_pinning_platform_interface:
    path: ../secure_pinning_platform_interface
