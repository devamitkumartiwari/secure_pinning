name: secure_pinning_web
description: >
  Web implementation of secure_pinning. Certificate pinning is not
  possible in a browser, so this reports a clear unsupported result.
version: 0.0.1
homepage: https://github.com/devamitkumartiwari/secure_pinning
repository: https://github.com/devamitkumartiwari/secure_pinning
issue_tracker: https://github.com/devamitkumartiwari/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

flutter:
  plugin:
    implements: secure_pinning
    platforms:
      web:
        pluginClass: SecurePinningWeb
        fileName: secure_pinning_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  secure_pinning_platform_interface: ^0.0.1

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
