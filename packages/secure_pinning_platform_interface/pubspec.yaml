name: secure_pinning_platform_interface
description: >
  Common platform interface and Pigeon-generated platform channel schema for
  the secure_pinning certificate-pinning plugin. Not meant for direct use by
  applications — depend on the secure_pinning package instead.
version: 1.0.0
homepage: https://github.com/therivanta/secure_pinning
repository: https://github.com/therivanta/secure_pinning
issue_tracker: https://github.com/therivanta/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.2
