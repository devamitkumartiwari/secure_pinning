name: secure_pinning_dio
description: >
  Dio integration for secure_pinning — an Interceptor-shaped facade for
  pinned TLS validation on Dio traffic.
version: 1.0.0
homepage: https://github.com/devamitkumartiwari/secure_pinning
repository: https://github.com/devamitkumartiwari/secure_pinning
issue_tracker: https://github.com/devamitkumartiwari/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning
  - dio

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  secure_pinning: ^1.0.0

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  secure_pinning:
    path: ../..
  secure_pinning_platform_interface:
    path: ../secure_pinning_platform_interface
