name: secure_pinning_android
description: >
  Android native probe-engine implementation for secure_pinning. Not meant
  for direct use by applications — depend on the secure_pinning package
  instead.
version: 0.0.1
homepage: https://github.com/devamitkumartiwari/secure_pinning
repository: https://github.com/devamitkumartiwari/secure_pinning
issue_tracker: https://github.com/devamitkumartiwari/secure_pinning/issues
topics:
  - security
  - networking
  - certificate-pinning

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

flutter:
  plugin:
    implements: secure_pinning
    platforms:
      android:
        package: com.therivanta.securepinning.android
        pluginClass: SecurePinningPlugin

dependencies:
  flutter:
    sdk: flutter
  secure_pinning_platform_interface: ^0.0.1

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
